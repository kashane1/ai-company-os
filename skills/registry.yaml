# Skill Registry
# This is the index of all canonical skills in the repo.
# Each entry points to the canonical definition file.
#
# Phase 0.5 additions:
#   kind: validator | agentic
#   fixture_status: passing | failing | missing
#   source: internal | external:<repo>@<commit>
#
# The loader (packages/tools/skills/loader.py) refuses to load a skill in
# mode="autonomous" unless fixture_status is "passing". Validator and agentic
# skills are mutually exclusive for synchronous callers.

skills:

  - id: product-artifact-chain
    name: Product Artifact Chain
    path: canonical/shared/product-artifact-chain.md
    owner_agent: supervisor
    target_runtimes: [claude, codex]
    stage: active
    kind: agentic
    # Phase 1 PR-1c: fixtures at
    # skills/canonical/shared/product-artifact-chain.fixtures.yaml
    # exercise validate_chain() from
    # packages/tools/product_artifacts/validator.py against synthetic
    # product directories (discovery / mvp-build / adversarial parent
    # reference missing). Structural check in
    # tests/python/unit/test_skill_reconciliation.py + verdict check
    # in tests/python/unit/test_product_artifact_chain_fixtures.py.
    fixture_status: passing
    source: internal
    adapters:
      claude: adapters/claude/product-artifact-chain.md
    project_skill: .claude/skills/product-artifact-chain.md

