inputs:
  - name: now_iso
    type: string
    required: false
    default_source: packages.policies.postmortem_retention.now_utc_iso
  - name: threshold_days
    type: integer
    required: false
    default_source: packages.policies.postmortem_retention.STALE_THRESHOLD_DAYS
outputs:
  - name: schema_version
    type: string
  - name: verdict
    type: enum
    values: [pass, soft_fail, hard_fail]
  - name: sub_checks
    type: list
    item_shape:
      - name: name
        type: string
      - name: severity
        type: enum
        values: [info, warn, fail, error, skipped]
      - name: summary
        type: string
      - name: detail
        type: object
  - name: infra_errors
    type: list
violations: []
# verification-loop-runtime is read-only and never raises. Sub-check
# crashes become severity=error (contributing to soft_fail), not policy
# violations. The lane intentionally has no hard_fail path: stale
# postmortems are operator hygiene, not a merge blocker.
