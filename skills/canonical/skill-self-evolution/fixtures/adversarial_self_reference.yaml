name: adversarial_self_reference
description: |
  Adversarial case: the worker attempts to evolve the skill-self-evolution
  skill itself. The target skill's registry entry carries
  self_evolvable: false (default), so the allowlist check refuses. This
  is the privilege-escalation gate — a compromised worker cannot promote
  itself to a less restrictive evolution profile without a human PR
  flipping the flag.

  Also verifies that even if the diff is structurally clean (only
  touches files under skills/canonical/skill-self-evolution/, is
  atomic, claude-only), the allowlist check still blocks.
input:
  target_skill_id: "skill-self-evolution"
  diff_paths:
    - "skills/canonical/skill-self-evolution/skill.md"
    - "skills/canonical/skill-self-evolution/fixtures/adversarial_self_reference.yaml"
  target_runtimes: ["claude"]
  registry_self_evolvable: false
  lock_held_by_other: false
expected:
  verdict: deny
  reason_code: "skill_not_self_evolvable"
