# Locks the release-candidate-record schema, screenshot readiness check,
# and TestFlight transition note against silent drift.

- name: happy_path
  description: Required contract surface present in the canonical body.
  input:
    skill_file: canonical/handoffs/ios-to-appstore-handoff.md
