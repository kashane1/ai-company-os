      - "`product_id`"
      - "`version`"
      - "`build_number`"
      - "`features`"
      - "`fixes`"
      - "`known_issues`"
      - "`metadata_draft_path`"
      - "`build_validated`"
      - "`handoff_timestamp`"
      - "`status`"
    required_failure_modes:
      - "Build validation incomplete"
      - "Metadata reference broken"
      - "Build number regression"
      - "Source modification during handoff"
    required_status_values:
      - "pending_appstore_review"
      - "submitted"
      - "in_review"
      - "approved"
      - "rejected"
