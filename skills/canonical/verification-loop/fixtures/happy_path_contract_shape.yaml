# Structural fixture — verification-loop umbrella contract shape.
#
# Freezes the canonical markdown + contract.yaml of the verification-loop
# umbrella after the structural/runtime split: it delegates structural
# checks to `verification-loop-structural` and runtime checks to
# `verification-loop-runtime`, and owns the shared severity enum,
# verdict aggregation, and caller-mapping table.

- name: happy_path_contract_shape
  description: |
    The umbrella skill must name both lanes, declare the 5-state
    severity enum, the caller-mapping table, the god-object guardrail,
    and the structural sub-check names it delegates.
  input:
    skill_file: canonical/verification-loop/skill.md
    contract_file: canonical/verification-loop/contract.yaml
  expected:
    required_strings_in_skill:
      - "verification-loop-structural"
      - "verification-loop-runtime"
      - "reconciliation"
      - "skill_stocktake"
      - "changed_surface"
      - "pass"
      - "soft_fail"
      - "hard_fail"
      - "info"
      - "warn"
      - "fail"
      - "error"
      - "skipped"
      - "VERIFICATION_LOOP_HARD_FAIL"
      - "verification_loop_runner"
      - "God-object trigger"
    required_sections:
      - "## Purpose"
      - "## Verification lanes"
      - "## Severity enum (5-state per todos 009 + 010)"
      - "## Caller → entry-point mapping (per todo 013)"
      - "## Boundaries and failure modes"
    required_contract_inputs:
      - since_ref
      - lookback_task_runs
    required_contract_outputs:
      - verdict
      - sub_checks
      - infra_errors
    required_contract_violations:
      - VERIFICATION_LOOP_HARD_FAIL

- name: deferred_subcheck_declares_stale_doc_detector
  description: |
    The umbrella must keep `stale-doc-detector` declared as a deferred
    sub-check, route it to the structural lane, and name the remaining
    activation step. The "## Deferred sub-checks" and "## Boundaries
    and failure modes" sections must both be present so the deferral
    and the per-lane god-object guardrail stay honest.
  input:
    skill_file: canonical/verification-loop/skill.md
  expected:
    required_strings_in_skill:
      - "Deferred sub-checks"
      - "stale-doc-detector"
      - "check_doc_paths.sh"
      - "4th sub-check"
      - "verification-loop-structural"
      - "verification-loop-runtime"
    required_sections:
      - "## Deferred sub-checks"
      - "## Boundaries and failure modes"
