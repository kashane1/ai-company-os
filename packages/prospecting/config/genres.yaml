# Non-exhaustive Places query catalog, not an inclusion filter.
# The qualifying signal is no publicly available website; genres only create
# cross-vertical search cells and are expected to expand over time.
genres:
  - id: beauty_salon
    label: beauty salon
    text_query_template: "{label} in {city_name}"
    included_types: ["beauty_salon"]
  - id: auto_repair
    label: auto repair
    text_query_template: "{label} in {city_name}"
    included_types: ["car_repair"]
