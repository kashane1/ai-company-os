composition_rules:
  - "Hero: a calm, minimal treatment room in soft window light — generous negative space."
  - "Detail/band: quiet still-life (linen, a single stem, amber dropper bottles) — texture over faces."
  - "Muted sage/clay/stone over warm cream; never bright or clinical; shallow depth of field."
image_prompts:
  hero: >-
    Generate a photorealistic, editorial hero image for a premium med spa website. Mood: a
    serene, refined wellness sanctuary. Palette: muted sage green, warm clay/terracotta, and
    soft stone with light oak wood. Scene: a calm, minimal treatment room — a clean treatment
    bed with linen, one sculptural potted plant, soft natural daylight from a large window,
    gentle diffused shadows, generous negative space. Style: magazine-quality, understated
    luxury, shallow depth of field. No people, no text, no logos, no watermarks. Wide 16:9 for
    a full-bleed website hero.
  bento: []
  band: >-
    A close-up editorial still life of calm spa details, in muted sage / warm clay / stone /
    light oak with soft natural light — neatly folded linen towels, a single white orchid stem,
    and a few amber glass dropper bottles on a light oak surface, soft diffused daylight,
    shallow depth of field, generous negative space. No people, no text, no logos. Wide 16:9.
