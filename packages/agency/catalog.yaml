# Agency service catalog — single source of truth for what the agency sells.
#
# Loaded + validated by packages/agency/catalog.py (mirrors the dataclass
# from_dict/to_dict convention). Human-readable render lives at
# docs/agency/service-catalog.md (keep the two in sync).
#
# Fees are USD. A `recurring` service must carry a positive monthly_fee; a
# `one_time` service must carry a positive setup_fee. Prices are list/anchor
# prices — the operator can override per client in the signed OFFER.md.

services:
  # --- Tier 1: easy add-ons ---
  - service_id: website
    name: Professional Website
    tier: tier_1
    bill_type: one_time
    setup_fee: 499
    monthly_fee: 0
    includes:
      - Up to 5 pages (home, services, about, contact, reviews)
      - Mobile-responsive Astro static build
      - Contact form
      - Basic on-page SEO metadata
    edit_limit: "Included copy edits during build; post-launch edits via hosting plan"
    ownership: client-owned

  - service_id: hosting
    name: Hosting & Maintenance
    tier: tier_1
    bill_type: recurring
    setup_fee: 0
    monthly_fee: 49
    includes:
      - Hosting + SSL
      - Backups
      - Content updates
      - Broken-link fixes
      - Contact-form monitoring
    edit_limit: "2 content updates / month"

  - service_id: gbp
    name: Google Business Profile Setup
    tier: tier_1
    bill_type: one_time
    setup_fee: 125
    monthly_fee: 0
    includes:
      - Claim / verify profile
      - Fix hours, services, categories
      - Add photos + descriptions
      - Add booking links

  - service_id: business_email
    name: Business Email Setup
    tier: tier_1
    bill_type: one_time
    setup_fee: 75
    monthly_fee: 0
    includes:
      - Google Workspace setup
      - "info@ / support@ / sales@ aliases"

  - service_id: contact_forms
    name: Contact Forms & Lead Routing
    tier: tier_1
    bill_type: one_time
    setup_fee: 75
    monthly_fee: 0
    includes:
      - Form to email (instant owner notification)
      - Durable lead capture + spam/honeypot filtering
      - Optional CRM routing (with the CRM Setup add-on)

  # --- Tier 2: high value ---
  # --- Booking: a "slot" — pick ONE base, then stack optional modifiers. ---
  - service_id: booking_connect
    name: "Booking — Connect (your tool)"
    tier: tier_2
    bill_type: one_time
    setup_fee: 150
    monthly_fee: 0
    exclusive_group: booking_base
    includes:
      - Embed + style your existing tool (Calendly / Square / Acuity / Booksy …)
      - Services mapped to bookable offerings
      - Confirmation + reminder setup
      - You keep + pay your booking provider

  - service_id: booking_setup
    name: "Booking — Done-for-you Setup"
    tier: tier_2
    bill_type: one_time
    setup_fee: 350
    monthly_fee: 0
    exclusive_group: booking_base
    includes:
      - We pick + fully configure the right platform (Calendly, Square, or Acuity)
      - Services, staff, durations, buffers, hours
      - Calendar sync + confirmations + reminders
      - You keep + pay the platform; account stays in your name

  - service_id: booking_native
    name: "Booking — Fully Managed"
    tier: tier_2
    bill_type: recurring
    setup_fee: 450
    monthly_fee: 35
    exclusive_group: booking_base
    includes:
      - We set up and run your booking on a proven platform (Square or Acuity) for you
      - Online scheduling, confirmations, and reminders configured and maintained
      - "Availability / service / staff changes handled for you (~2 change requests/mo)"
      - No-show monitoring + a monthly booking-link & calendar-sync check
      - Account stays in your name; you keep and pay the platform, we do the work
      - "Deposits / prepayment available as an add-on (Booking Deposits)"
    edit_limit: "~2 change requests / month included (see client-sla.md)"

  - service_id: booking_deposits
    name: Booking Deposits & Prepayment
    tier: tier_2
    bill_type: one_time
    setup_fee: 120
    monthly_fee: 0
    requires_group: booking_base
    includes:
      - Take a card or deposit at booking to cut no-shows
      - Stripe / Square payment configured on the booking flow

  - service_id: booking_multistaff
    name: Booking Multi-staff & Resources
    tier: tier_2
    bill_type: one_time
    setup_fee: 150
    monthly_fee: 0
    requires_group: booking_base
    includes:
      - Per-staff calendars, individual availability, and service assignment
      - Room / resource scheduling where the platform supports it

  - service_id: booking_classes
    name: Class & Group Scheduling
    tier: tier_2
    bill_type: one_time
    setup_fee: 200
    monthly_fee: 0
    requires_group: booking_base
    includes:
      - Capacity limits and recurring class schedules (yoga / gym / workshops)
      - Waitlists where the platform supports them

  - service_id: booking_intake
    name: Booking Intake Forms
    tier: tier_2
    bill_type: one_time
    setup_fee: 90
    monthly_fee: 0
    requires_group: booking_base
    includes:
      - Pre-appointment forms / questionnaires (consult, medical, project brief)

  - service_id: booking_management
    name: Booking Management
    tier: tier_2
    bill_type: recurring
    setup_fee: 0
    monthly_fee: 35
    requires_group: booking_base
    includes:
      - Ongoing availability / service / staff edits, seasonal hours
      - No-show monitoring (for Connect / Done-for-you; Fully Managed includes this)

  - service_id: reviews
    name: Review Readiness System
    tier: tier_2
    bill_type: recurring
    setup_fee: 75
    monthly_fee: 39
    includes:
      - Google review link
      - Review request template draft (email / in-person QR)
      - Cadence management and compliance checklist
      - "SMS review requests planned: require a signed consent addendum (not yet enabled)"

  - service_id: local_seo
    name: Local SEO
    tier: tier_2
    bill_type: recurring
    setup_fee: 400
    monthly_fee: 95
    includes:
      - City / service / location / FAQ pages
      - Service x geo page matrix
      - On-page optimization

  - service_id: monthly_reporting
    name: Analytics Dashboard & Monthly Report
    tier: tier_2
    bill_type: recurring
    setup_fee: 50
    monthly_fee: 20
    includes:
      - Owner-friendly monthly report (calls, form leads, bookings)
      - Edits completed
      - Recommended next action

  # --- Tier 3: recurring-revenue goldmine ---
  - service_id: promo_landing_page
    name: Promotional Landing Page
    tier: tier_3
    bill_type: one_time
    setup_fee: 400
    monthly_fee: 0
    includes:
      - Single-purpose campaign page (e.g. summer.company.com)
      - Conversion-oriented copy + form

  - service_id: google_ads
    name: Google Ads Management
    tier: tier_3
    bill_type: recurring
    setup_fee: 300
    monthly_fee: 350
    includes:
      - Campaign setup + management
      - Ad copy + keyword/negative lists (spend owned by client)

  - service_id: meta_ads
    name: Meta (Facebook/Instagram) Ads Management
    tier: tier_3
    bill_type: recurring
    setup_fee: 300
    monthly_fee: 350
    includes:
      - Campaign setup + management
      - Creative variants + audiences (spend owned by client)

  - service_id: crm_setup
    name: CRM Setup
    tier: tier_3
    bill_type: one_time
    setup_fee: 250
    monthly_fee: 0
    includes:
      - HubSpot (default) or GoHighLevel setup; Zoho / Pipedrive on request
      - Pipeline + fields configured from intake

  - service_id: follow_up_automation
    name: Automated Follow-Up
    tier: tier_3
    bill_type: recurring
    setup_fee: 125
    monthly_fee: 39
    includes:
      - Instant auto-email reply to every new lead
      - 2-day reminder sequence + owner task reminders
      - "Auto-text available on GoHighLevel (email-first on HubSpot)"

# Setup-only bundle discount for build-your-own carts (custom service sets).
# Named packages below use an explicit setup_promo instead (always <= the tier
# discount for the same set, enforced at catalog load).
discount_tiers:
  - { min_services: 1, max_services: 2, pct: 0 }
  - { min_services: 3, max_services: 4, pct: 10 }
  - { min_services: 5, max_services: null, pct: 15 }

bundles:
  - bundle_id: package_a
    name: "Package A — Presence"
    description: Look professional online. Website + the annoying tech handled.
    setup_promo: 599
    service_ids:
      - website
      - hosting
      - gbp
      - business_email

  - bundle_id: package_b
    name: "Package B — Presence + Capture"
    description: Everything in A, plus turn visitors into booked customers.
    setup_promo: 899
    service_ids:
      - website
      - hosting
      - gbp
      - business_email
      - reviews
      - booking_setup

  - bundle_id: package_c
    name: "Package C — Presence + Capture + Growth"
    description: Everything in B, plus local SEO, landing pages, monthly reporting, and Google Search ads.
    setup_promo: 1799
    service_ids:
      - website
      - hosting
      - gbp
      - business_email
      - reviews
      - booking_setup
      - local_seo
      - promo_landing_page
      - monthly_reporting
      - google_ads
