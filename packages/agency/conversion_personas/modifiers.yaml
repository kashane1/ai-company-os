modifiers:
  - modifier_id: home_services
    verticals: [plumber, plumbing, roofer, roofing, hvac, electrician, landscaper, pest_control, cleaner, house_cleaning, contractor, handyman]
    objections:
      - Can they come quickly?
      - Are they licensed and insured?
      - Will the estimate be fair?
      - Will they leave my home clean and safe?
    trust_signals:
      - License and insurance
      - Emergency or same-day availability
      - Service area and arrival windows
      - Before/after job photos
    decision_triggers:
      - emergency repair
      - visible property damage
      - seasonal maintenance
      - quote before a larger project
    compliance_notes:
      - Do not claim licensing, bonding, insurance, or guarantees unless verified.

  - modifier_id: personal_care
    verticals: [barber_shop, beauty_salon, hair_salon, nail_salon, spa, tattoo_shop, massage_therapy]
    objections:
      - Will they understand the style I want?
      - Is the space clean and professional?
      - Can I book a convenient time?
      - Will the result match the photos?
    trust_signals:
      - Portfolio photos
      - Online booking
      - Cleanliness cues
      - Reviews mentioning specific stylists or services
    decision_triggers:
      - upcoming event
      - routine grooming
      - style change
      - gift or self-care moment
    compliance_notes:
      - Avoid health or therapeutic claims unless supported and allowed.

  - modifier_id: health_wellness
    verticals: [dentist, dental, med_spa, chiropractor, physical_therapy, clinic, optometrist, therapist, nutritionist]
    objections:
      - Is this provider qualified?
      - Is treatment safe?
      - What will it cost?
      - Will I be judged or pressured?
    trust_signals:
      - Provider credentials
      - Safety and privacy language
      - Consultation process
      - Realistic outcomes and FAQs
    decision_triggers:
      - pain or discomfort
      - preventive care
      - cosmetic confidence
      - referral from another provider
    compliance_notes:
      - Avoid unverified medical outcomes, cure claims, and deceptive before/after framing.

  - modifier_id: professional_services
    verticals: [notary, accountant, tax_preparer, lawyer, attorney, consultant, insurance, financial_services, bookkeeper]
    objections:
      - Can I trust them with sensitive information?
      - Are they qualified for my situation?
      - What documents or details do I need?
      - What does the process cost?
    trust_signals:
      - Credentials and scope
      - Privacy language
      - Process checklist
      - Clear consultation or appointment flow
    decision_triggers:
      - deadline
      - legal or financial risk
      - paperwork complexity
      - business compliance need
    compliance_notes:
      - Avoid legal, tax, insurance, or financial promises beyond verified scope.

  - modifier_id: food_hospitality
    verticals: [restaurant, cafe, coffee_shop, bakery, bar, catering, food_truck, diner]
    objections:
      - Is the food good and fresh?
      - Are hours and location clear?
      - Can I order, reserve, or cater easily?
      - Is this right for my group or occasion?
    trust_signals:
      - Menu visibility
      - Photos of actual food and space
      - Hours, location, and ordering links
      - Reviews mentioning favorite items
    decision_triggers:
      - hunger now
      - group outing
      - event catering
      - local favorite discovery
    compliance_notes:
      - Do not imply health, allergy safety, or dietary guarantees unless verified.

  - modifier_id: auto_services
    verticals: [auto_repair, mechanic, mobile_mechanic, tire_shop, body_shop, car_wash, detailing, towing]
    objections:
      - Will they diagnose honestly?
      - Can they help quickly?
      - What will the repair cost?
      - Are they qualified for my vehicle?
    trust_signals:
      - Certifications or years of experience
      - Warranty or estimate process
      - Mobile or towing availability
      - Reviews mentioning honesty
    decision_triggers:
      - breakdown
      - warning light
      - inspection or maintenance
      - cosmetic restoration
    compliance_notes:
      - Do not claim certifications, warranties, or insurance coverage unless verified.

  - modifier_id: retail
    verticals: [retail, boutique, florist, gift_shop, furniture_store, jewelry_store, appliance_store]
    objections:
      - Do they carry what I need?
      - Are prices and availability clear?
      - Can I browse, call, order, or visit easily?
      - Is the shop worth a trip?
    trust_signals:
      - Product photos
      - Inventory or category clarity
      - Hours and location
      - Return or ordering policies
    decision_triggers:
      - gift need
      - local shopping preference
      - urgent replacement
      - special occasion
    compliance_notes:
      - Avoid inventory or availability claims unless current.

  - modifier_id: classes_activities
    verticals: [yoga, gym, dance_studio, martial_arts, tutoring, music_lessons, art_classes, daycare, camp]
    objections:
      - Is this good for my level or child?
      - What is the schedule and price?
      - Is the instructor qualified?
      - Can I try it before committing?
    trust_signals:
      - Schedule and class levels
      - Instructor bios
      - Trial class or consultation
      - Parent or student reviews
    decision_triggers:
      - new routine
      - child development
      - fitness goal
      - summer or seasonal program
    compliance_notes:
      - Be careful with child safety, supervision, and outcome claims.

  - modifier_id: real_estate_property
    verticals: [real_estate, realtor, property_management, mortgage_broker, home_inspector, apartment_locator]
    objections:
      - Can they handle a high-stakes property decision?
      - Do they know my area?
      - What is the process and timeline?
      - Will they communicate clearly?
    trust_signals:
      - Local market knowledge
      - Process steps
      - Reviews and transaction examples
      - Clear consultation CTA
    decision_triggers:
      - buying or selling timeline
      - rental vacancy
      - inspection deadline
      - relocation
    compliance_notes:
      - Avoid fair-housing issues and unverified financing or investment claims.

  - modifier_id: pet_services
    verticals: [pet_grooming, dog_groomer, veterinarian, vet, dog_trainer, pet_boarding, dog_walker]
    objections:
      - Will they treat my pet gently?
      - Are they qualified and safe?
      - What happens during the visit?
      - Can I trust them with my pet alone?
    trust_signals:
      - Staff experience
      - Safety and handling policies
      - Facility or service photos
      - Reviews mentioning care and communication
    decision_triggers:
      - grooming need
      - pet health concern
      - travel or boarding
      - behavior problem
    compliance_notes:
      - Avoid veterinary outcome claims unless made by qualified providers.
