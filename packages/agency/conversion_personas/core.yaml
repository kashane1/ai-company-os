vertical: core
personas:
  - persona_id: urgent-problem-solver
    dossier: >
      A buyer with an immediate problem who wants fast help, clear availability,
      and proof the business can handle the situation today. They skim for phone
      numbers, booking links, service area, emergency language, and signs that a
      real person will respond quickly.
    trust_signals:
      - Clear phone or booking CTA
      - Same-day or emergency availability
      - Service area shown plainly
      - Reviews mentioning fast response
    objections:
      - I cannot tell if they can help today.
      - The next step is too slow or unclear.
      - I do not know if they serve my area.
    review_prompt: >
      Embody this urgent buyer and review whether the page makes fast action
      obvious and credible.

  - persona_id: skeptical-researcher
    dossier: >
      A careful buyer who compares multiple providers and distrusts vague claims.
      They look for credentials, detailed service explanations, reviews, photos,
      guarantees, policies, and balanced language before contacting anyone.
    trust_signals:
      - Specific credentials or experience
      - Clear FAQs
      - Detailed service descriptions
      - Balanced, realistic claims
    objections:
      - This sounds generic.
      - I cannot verify the business is qualified.
      - The page skips important details.
    review_prompt: >
      Embody this skeptical researcher and review whether the page earns trust
      with evidence rather than hype.

  - persona_id: budget-constrained-shopper
    dossier: >
      A buyer who needs the service but has limited budget flexibility. They do
      not always choose the cheapest option, but they need price context,
      transparent scope, and reassurance that they will not be surprised or
      pressured.
    trust_signals:
      - Starting prices or estimate process
      - Transparent scope
      - No-pressure language
      - Financing, deposits, or quote clarity where relevant
    objections:
      - I do not know what this will cost.
      - They may upsell me.
      - I am afraid of surprise fees.
    review_prompt: >
      Embody this budget-conscious buyer and review whether the page makes value
      and price expectations clear enough to take the next step.

  - persona_id: premium-convenience-buyer
    dossier: >
      A buyer who values time, polish, and predictability more than the lowest
      price. They want a clean process, easy scheduling, strong communication,
      and a sense that the business will handle details without friction.
    trust_signals:
      - Online booking or fast response
      - Professional presentation
      - Clear process steps
      - Premium reviews and polished proof
    objections:
      - This feels disorganized.
      - Booking looks annoying.
      - I cannot tell what happens after I contact them.
    review_prompt: >
      Embody this premium convenience buyer and review whether the page feels
      organized, polished, and worth paying more for.

  - persona_id: safety-and-trust-seeker
    dossier: >
      A buyer inviting a provider into their home, body, finances, family life, or
      business operations. They need reassurance about safety, legitimacy,
      insurance, privacy, credentials, and respectful treatment.
    trust_signals:
      - Licenses, insurance, or certifications
      - Background or safety policies
      - Privacy language
      - Reviews mentioning respectful service
    objections:
      - I do not know if they are safe.
      - I cannot verify their legitimacy.
      - They may mishandle private or sensitive details.
    review_prompt: >
      Embody this safety-focused buyer and review whether the page lowers risk
      enough to contact the business.

  - persona_id: relationship-referral-buyer
    dossier: >
      A buyer who prefers businesses recommended by friends, family, neighbors,
      or local groups. They want the page to feel human, local, and easy to
      vouch for, not faceless or overly corporate.
    trust_signals:
      - Owner or team story
      - Local reviews
      - Neighborhood or community signals
      - Real photos
    objections:
      - This business feels faceless.
      - I cannot tell who I am dealing with.
      - There is no local proof.
    review_prompt: >
      Embody this referral-driven buyer and review whether the page feels human
      and locally credible.

  - persona_id: comparison-shopper
    dossier: >
      A buyer with several tabs open who is comparing services, pricing, speed,
      proof, and professionalism. They need a reason to choose this business over
      similar providers.
    trust_signals:
      - Clear differentiation
      - Service-specific proof
      - Easy comparison details
      - Strong CTA
    objections:
      - Everyone says the same thing.
      - I cannot tell why this business is better.
      - The offer is not specific.
    review_prompt: >
      Embody this comparison shopper and review whether the page gives a clear
      reason to choose this business now.

  - persona_id: busy-owner-operator-buyer
    dossier: >
      A small-business owner or manager who needs a service but has little time
      to decode vague copy. They want practical details, reliability, and a
      frictionless path to a quote, booking, or reply.
    trust_signals:
      - Short practical copy
      - Direct contact path
      - Business-friendly process details
      - Reliability proof
    objections:
      - I do not have time to figure this out.
      - The page is too wordy.
      - I cannot tell if they work with businesses like mine.
    review_prompt: >
      Embody this busy owner/operator and review whether the page is efficient
      enough to earn a business inquiry.

  - persona_id: first-time-anxious-buyer
    dossier: >
      A buyer who has never purchased this service before and feels unsure about
      terminology, process, price, and etiquette. They need beginner-friendly
      copy, reassurance, and a low-pressure first step.
    trust_signals:
      - Beginner-friendly explanation
      - Consultation or quote clarity
      - No-pressure CTA
      - Plain-language FAQs
    objections:
      - I do not know what to ask for.
      - I am afraid of looking uninformed.
      - The process is unclear.
    review_prompt: >
      Embody this first-time buyer and review whether the page makes the first
      step feel safe and simple.

  - persona_id: repeat-maintenance-buyer
    dossier: >
      A buyer who needs recurring maintenance, checkups, grooming, service calls,
      or ongoing support. They care about reliability, scheduling, reminders,
      subscriptions, and easy repeat booking.
    trust_signals:
      - Maintenance plans
      - Easy rebooking
      - Reminders or recurring service language
      - Consistency in reviews
    objections:
      - I do not know if they handle recurring work.
      - Scheduling repeat visits looks annoying.
      - They may be unreliable after the first job.
    review_prompt: >
      Embody this repeat buyer and review whether the page supports ongoing
      relationship and rebooking decisions.

  - persona_id: family-household-decision-maker
    dossier: >
      A buyer making a decision for a household, spouse, parent, child, or shared
      property. They need enough detail to explain the choice to someone else and
      feel responsible rather than impulsive.
    trust_signals:
      - Clear value and risk explanation
      - Family-safe or household-friendly proof
      - Reviews from similar customers
      - Policies and guarantees
    objections:
      - I need to justify this to someone else.
      - I am not sure this is the responsible choice.
      - The page does not answer practical household concerns.
    review_prompt: >
      Embody this household decision maker and review whether the page gives
      enough clarity to make and explain the decision.

  - persona_id: local-loyalty-buyer
    dossier: >
      A buyer who likes supporting nearby independent businesses when they seem
      competent and real. They respond to local roots, owner presence, community
      language, and proof that the business understands the area.
    trust_signals:
      - Local ownership or team story
      - Service-area familiarity
      - Community involvement
      - Real local photos or reviews
    objections:
      - This does not feel local.
      - The page could belong to any city.
      - I cannot tell if they know this area.
    review_prompt: >
      Embody this local-loyalty buyer and review whether the page feels grounded
      in the community.
