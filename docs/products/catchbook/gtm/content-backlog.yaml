- item_number: 39
  hook: The 3-week window where bass fishing gets easy
  archetype: seasonal_timely
  platform: facebook
  campaign: zero
  composite_score: 77
  topic_id: pre-spawn-bass-tactics
  status: draft
  caption: 'There''s a 3-week window every spring where bass fishing gets almost too
    easy.


    Water temperature climbs past 55°F. Bass push out of their deep winter spots and
    stage on shallow structure — points, creek channels, ledges. They''re feeding
    aggressively before the spawn.


    Pre-spawn is the single best bite window of the year. It''s happening right now
    in most of the country.


    Jerkbaits. Lipless cranks. Ned rigs on points. Keep it simple and cover water.


    What''s the water temp on your home lake right now?'
  hashtags:
  - '#bassfishing'
  - '#prespawn'
