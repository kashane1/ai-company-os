name: FishingLogbook
options:
  bundleIdPrefix: io.aicompanyos.products
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  FishingLogbook:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Fishing Logbook
        NSLocationWhenInUseUsageDescription: Capture trip locations privately for your own fishing history.
        NSPhotoLibraryUsageDescription: Attach optional catch photos to your private fishing log.
        NSPhotoLibraryAddUsageDescription: Save optional catch photos for your private fishing history.
        UIApplicationSupportsIndirectInputEvents: YES
        UILaunchScreen:
          {}
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: io.aicompanyos.products.fishinglogbook.backup
            UTTypeConformsTo:
              - com.apple.package
            UTTypeDescription: Fishing Logbook Backup
            UTTypeTagSpecification:
              public.filename-extension:
                - flbackup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.aicompanyos.products.fishinglogbook
        PRODUCT_NAME: Fishing Logbook
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: NO
        DEVELOPMENT_ASSET_PATHS: "\"\""
    scheme:
      gatherCoverageData: true
      coverageTargets:
        - FishingLogbook
      testTargets:
        - FishingLogbookTests
  FishingLogbookTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: FishingLogbook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.aicompanyos.products.fishinglogbookTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Fishing Logbook.app/Fishing Logbook"
