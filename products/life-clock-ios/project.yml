name: LifeClock
options:
  bundleIdPrefix: io.aicompanyos.products
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.0
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: 1.0
# Per-machine signing settings (DEVELOPMENT_TEAM) live in
# LifeClock.local.xcconfig (gitignored). Xcode re-reads the xcconfig at
# build time, so editing the team ID there does not require a regen.
configFiles:
  Debug: LifeClock.local.xcconfig
  Release: LifeClock.local.xcconfig
targets:
  LifeClock:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Folder reference for the quest pool — preserves the QuestPool/
      # subdirectory in the .app bundle so QuestPool.loadFromBundle(_:)
      # can resolve "QuestPool/<basename>.json" without flattening.
      # Phase 2 of the quest-pool affinity engine
      # (docs/plans/2026-05-08-feat-quest-pool-affinity-engine-plan.md).
      - path: Resources/QuestPool
        type: folder
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Life Clock
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: YES
        NSHealthShareUsageDescription: "Life Clock reads your activity, sleep, and body-metric data from Apple Health (steps, exercise minutes, active energy, resting heart rate, sleep analysis, and body mass) to estimate how today's habits move your time trajectory. Your data stays on your device."
        NSHealthUpdateUsageDescription: "Life Clock may save optional wellness entries to Apple Health if you choose to enable this later."
        # iPhone: portrait-only is fine for an iPhone-first app
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # iPad: all four orientations required by App Store validation
        # (error 90474) for iPad multitasking compliance, because
        # TARGETED_DEVICE_FAMILY = "1,2" includes iPad.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Pre-declare export-compliance: the app does not implement or
        # call any custom encryption. URLSession's built-in HTTPS is
        # iOS-system encryption (Apple's), which is exempt under
        # Category 5, Part 2 of the U.S. Export Administration Regulations.
        # Setting this to false tells ASC the answer to the encryption
        # prompt up-front, so the "Missing Compliance" warning never
        # appears on future TestFlight builds.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: LifeClock.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.aicompanyos.products.lifeclock
        PRODUCT_NAME: LifeClock
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        DEVELOPMENT_ASSET_PATHS: "\"\""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: LifeClock.entitlements
    scheme:
      gatherCoverageData: true
      coverageTargets:
        - LifeClock
      testTargets:
        - LifeClockTests
        - LifeClockUITests
      storeKitConfiguration: Sources/Services/Products.storekit
      # Note: an earlier preAction here ran `xcodegen generate` on every
      # build to pick up new Swift files automatically. It was removed
      # because Xcode auto-cancels the build when the .pbxproj is rewritten
      # mid-build setup, leading to a "Build Canceled" loop on every Run.
      # If you add a new .swift file under Sources/, run `xcodegen generate`
      # manually from products/life-clock-ios/ to refresh the project.
  LifeClockTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Sources/Services/Products.storekit
        buildPhase: resources
    dependencies:
      - target: LifeClock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.aicompanyos.products.lifeclockTests
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LifeClock.app/LifeClock"
        # Match the app target. xcodegen does not propagate device-family
        # settings to test bundles, so iPad-destination test runs would
        # otherwise mask iPhone-compatibility-mode regressions — see
        # docs/solutions/integration-issues/ios-ipad-compatibility-mode-cramped-layout.md.
        TARGETED_DEVICE_FAMILY: "1,2"
  LifeClockUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: LifeClock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.aicompanyos.products.lifeclockUITests
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LifeClock
        TARGETED_DEVICE_FAMILY: "1,2"
