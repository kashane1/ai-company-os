name: LifeClock
options:
  bundleIdPrefix: io.aicompanyos.products
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  LifeClock:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Life Clock
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: YES
        NSHealthShareUsageDescription: "Life Clock reads your steps, sleep, exercise, and resting heart rate from Apple Health to estimate how today's habits move your time trajectory. Your data stays on your device."
        NSHealthUpdateUsageDescription: "Life Clock may save optional wellness entries to Apple Health if you choose to enable this later."
    entitlements:
      path: LifeClock.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.aicompanyos.products.lifeclock
        PRODUCT_NAME: LifeClock
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3YCTPY88Y4
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        DEVELOPMENT_ASSET_PATHS: "\"\""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: LifeClock.entitlements
    scheme:
      gatherCoverageData: true
      coverageTargets:
        - LifeClock
      testTargets:
        - LifeClockTests
        - LifeClockUITests
      storeKitConfiguration: Sources/Services/Products.storekit
  LifeClockTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Sources/Services/Products.storekit
        buildPhase: resources
    dependencies:
      - target: LifeClock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.aicompanyos.products.lifeclockTests
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3YCTPY88Y4
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LifeClock.app/LifeClock"
        # Match the app target. xcodegen does not propagate device-family
        # settings to test bundles, so iPad-destination test runs would
        # otherwise mask iPhone-compatibility-mode regressions — see
        # docs/solutions/integration-issues/ios-ipad-compatibility-mode-cramped-layout.md.
        TARGETED_DEVICE_FAMILY: "1,2"
  LifeClockUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: LifeClock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.aicompanyos.products.lifeclockUITests
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3YCTPY88Y4
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LifeClock
        TARGETED_DEVICE_FAMILY: "1,2"
