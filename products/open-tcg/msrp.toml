since = "2023-03-31"
name_excludes = ["Display", "Case", "Surprise Box", "Trick or Trade", "Battle Deck"]
note = "6 packs × $4.49"

[[form_default]]
form = "booster_box"
msrp = 161.64
since = "2023-03-31"
name_excludes = ["Case", "Half"]
note = "36 packs × $4.49; enhanced displays are the same price"

[[pack_price]]
msrp = 4.49
since = "2023-03-31"

[[form_default]]
