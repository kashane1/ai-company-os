[[unpriced]]
product_id = 678555
name = "Prismatic Evolutions Booster Bundle + Surprise Box Bundle (Sam's Club)"
reason = "Sam's Club-only bundle (Booster Bundle + Surprise Box, 10 packs total). samsclub.com blocks fetches and no search snapshot showed its price. Social restock posts (x.com/PokemonDealsTCG, Feb 2026) and StockX quote a $39.98 Sam's Club price, but those are not qualifying sources. Component MSRPs: bundle $26.94, Surprise Box $22.99 (PHD PKU10096)."

[[unpriced]]
product_id = 610317
name = "Prismatic Evolutions Booster Bundle Display"
reason = "No MSRP found for the display itself. Sellers say a Booster Bundle Display holds 10 bundles (60 packs). 10 x $26.94 = $269.40, matching PHD's 151 Booster Bundle Display (PKU85321, $269.40/10 bundles). That is an analogy, not evidence for this product."

[[unpriced]]
product_id = 670607
name = "Prismatic Evolutions Elite Trainer Box (Dollar General Exclusive)"
reason = "No Dollar General price found from DG or press. One seller says this version has 8 packs instead of 9. Only an unverified DG customer review mentions a price. Do not assume the $49.99 standard ETB price."

[[unpriced]]
product_id = 630433
name = "Black Bolt Booster Bundle Display"
reason = "No MSRP found for the display. Sellers (Card Codex, PokeBoxUSA) list 10 bundles per display; one seller says 8. 10 x $26.94 = $269.40 would be an inference, not evidence. Do not confuse with the 25-bundle case."

[[unpriced]]
product_id = 630698
name = "White Flare Booster Bundle Display"
reason = "Same as Black Bolt Booster Bundle Display: no display MSRP found, and the bundle count is not authoritatively confirmed."

[[unpriced]]
product_id = 644298
name = "Mega Evolution Booster Box"
reason = "No qualifying MSRP for the standard (non-enhanced) ME01 display. PHD's ME01 solicitation lists only the Enhanced Booster Display, and Pokemon Center sold only the Enhanced. PokeGuardian lists $161.64 but says its MSRPs are 'unconfirmed ... taken off previous sets'. Every other 36-pack display this era is $161.64; that is a pattern, not evidence."

[[unpriced]]
product_id = 692362
name = "Ascended Heroes Booster Bundle Display"
reason = "No display MSRP found. Sellers say 10 bundles x 6 packs. PHD's AH solicitation lists only the single Booster Bundle ($26.94), so 10 x $26.94 = $269.40 is an inference."
