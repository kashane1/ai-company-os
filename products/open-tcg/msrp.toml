# MSRPs for store price classes (plan phase P3). Source of truth; synced into
# the msrp_references table on every store run and by `radar msrp`.
#
# [[reference]]: evidence only. basis is official_listing (Pokémon Center US),
#   big_box_first_party (Target/Walmart/Best Buy/GameStop selling it themselves
#   at list price) or distributor_or_press (distributor solicitation or press).
#   Only these can make a listing alert. Watches whose alert_at is a Best Buy
#   first-party price also count (big_box_first_party); a row here wins.
# [[form_default]] and [[pack_price]]: estimates. They rank offers in the
#   digest but never alert. Windows start 2023-03-31 (Scarlet & Violet base
#   set, when packs rose from $3.99 to $4.49), where the evidence starts; older
#   sets have no estimate until researched.
# [[unpriced]]: products deliberately left without an MSRP (no estimate).
#
# Weekly refresh: `radar msrp missing` lists products with no evidence.
# Pokémon Center Canada pages (en-ca) show CAD prices labeled USD; never use them.
#
# Researched 2026-10-24. Every Scarlet & Violet and Mega Evolution set, from
# Scarlet & Violet base (2023-03-31) to Delta Reign: ETB $49.99, Pokémon Center
# ETB $59.99, booster bundle $26.94 (6 × $4.49; PHD solicited 2023 bundles at
# $26.99), 36-pack display and enhanced display $161.64 (36 × $4.49).
# Crown Zenith (Jan 2023, last Sword & Shield set) kept $3.99 packs.
# Sword & Shield era (Feb 2020 to Mar 2023, researched 2026-10-25): $3.99
# packs, ETB $39.99 (8 packs), Pokémon Center ETB $49.99 (10 packs, from
# Chilling Reign), bundle $23.94, display $143.64. Special sets (Champion's
# Path, Shining Fates, Celebrations, Pokémon GO) have their own evidence rows.

[[form_default]]
form = "etb"
msrp = 49.99
since = "2023-03-31"
name_excludes = ["Set of"]
note = "Standard ETB, every 2023-2026 set with evidence"

[[form_default]]
form = "etb"
exclusive = "Pokemon Center"
msrp = 59.99
since = "2023-03-31"
name_excludes = ["Set of"]
note = "Pokémon Center ETB, every 2023-2026 set with evidence"

[[form_default]]
