# MSRPs for store price classes (plan phase P3). Source of truth; synced into
# the msrp_references table on every store run and by `radar msrp`.
#
# [[reference]]: evidence only. basis is official_listing (Pokémon Center US),
#   big_box_first_party (Target/Walmart/Best Buy/GameStop selling it themselves
#   at list price) or distributor_or_press (distributor solicitation or press).
#   Only these can make a listing alert. Watches whose alert_at is a Best Buy
#   first-party price also count (big_box_first_party); a row here wins.
# [[form_default]] and [[pack_price]]: estimates. They rank offers in the
#   digest but never alert. Windows start 2025-01-01 because that is where the
#   evidence below starts; older sets have no estimate until researched.
# [[unpriced]]: products deliberately left without an MSRP (no estimate).
#
# Weekly refresh: `radar msrp missing` lists products with no evidence.
# Pokémon Center Canada pages (en-ca) show CAD prices labeled USD; never use them.
#
# Researched 2026-10-24. Every set from Prismatic Evolutions to Delta Reign:
# ETB $49.99, Pokémon Center ETB $59.99, booster bundle $26.94 (6 × $4.49),
# 36-pack display and enhanced display $161.64 (36 × $4.49).

[[form_default]]
form = "etb"
msrp = 49.99
since = "2025-01-01"
note = "Standard ETB, every 2025-2026 set with evidence"

[[form_default]]
form = "etb"
exclusive = "Pokemon Center"
msrp = 59.99
since = "2025-01-01"
note = "Pokémon Center ETB, every 2025-2026 set with evidence"

[[form_default]]
form = "booster_bundle"
msrp = 26.94
since = "2025-01-01"
name_excludes = ["Display", "Case", "Surprise Box"]
note = "6 packs × $4.49"

[[form_default]]
form = "booster_box"
msrp = 161.64
since = "2025-01-01"
name_excludes = ["Case", "Half"]
note = "36 packs × $4.49; enhanced displays are the same price"

[[pack_price]]
msrp = 4.49
since = "2025-01-01"

