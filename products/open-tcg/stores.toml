# OpenTCG independent store registry.
#
# Source configuration that Claude maintains; product intent stays in
# watchlist.toml. Only `platform = "shopify_json"` stores are polled, through
# Shopify's public /products.json and /collections.json after a robots.txt
# check, one request per host at a time. Other platforms are recorded with
# their reason until an adapter exists (P5). Collection only: stores produce
# no observations or alerts yet.
#
# Plans: docs/plans/2026-10-23-open-tcg-indie-store-monitoring.md
#        docs/plans/2026-10-24-open-tcg-store-registry-p1.md
# Platform probe: docs/products/open-tcg/research/2026-10-23-indie-store-platform-probe.json
#
# tier:     first_pass (newest page every 15 min) | explore, backup (hourly) | parked (not polled)
# platform: shopify_json | shopify_html | woocommerce | wix | ecwid | crystalcommerce | challenge | unknown
# discovery_every_minutes overrides the tier cadence (the six non-first-pass pilot stores stay at 15).
# newsletter = true: the store offers a drop or restock email signup (founder sheet).
# email_signup: drop | newsletter | restock_button | loyalty | none | unreachable (2026-10-24 survey)
# email_status: subscribed (as ksakhakorn@gmail.com) | needs_founder (Shopify CAPTCHA) | none
# Details: docs/products/open-tcg/research/2026-10-24-store-email-signup-survey.json
# discord_status: joined | pending_application | invite_expired (2026-10-24, founder account)
# trust: unvetted | checked | purchased_ok | avoid
# Domains are exact. A response that redirects off the domain is discarded.

