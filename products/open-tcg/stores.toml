# OpenTCG independent store registry (P0 pilot).
#
# Source configuration that Claude maintains; product intent stays in
# watchlist.toml. Every store here is read through Shopify's public
# /products.json, after checking robots.txt, one request per host at a time.
# Collection only: these stores produce no observations or alerts yet.
#
# Plan: docs/plans/2026-10-23-open-tcg-indie-store-monitoring.md
# Platform probe: docs/products/open-tcg/research/2026-10-23-indie-store-platform-probe.json
#
# tier:  first_pass | explore | backup | parked
# trust: unvetted | checked | purchased_ok | avoid
# Domains are exact. A response that redirects off the domain is discarded.

