name: Catchbook
options:
  bundleIdPrefix: io.aicompanyos.products
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
targets:
  Catchbook:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Catchbook
        NSLocationWhenInUseUsageDescription: Capture trip locations privately for your own fishing history.
        NSPhotoLibraryUsageDescription: Attach optional catch photos to your private fishing log.
        NSPhotoLibraryAddUsageDescription: Save optional catch photos for your private fishing history.
        UIApplicationSupportsIndirectInputEvents: YES
        UILaunchScreen:
          {}
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: io.aicompanyos.products.fishinglogbook.backup
            UTTypeConformsTo:
              - com.apple.package
            UTTypeDescription: Catchbook Backup
            UTTypeTagSpecification:
              public.filename-extension:
                - flbackup
    entitlements:
      path: Catchbook.entitlements
      properties:
        com.apple.developer.weatherkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.aicompanyos.products.fishinglogbook
        PRODUCT_NAME: Catchbook
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: NO
        DEVELOPMENT_ASSET_PATHS: "\"\""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Catchbook.entitlements
    scheme:
      gatherCoverageData: true
      coverageTargets:
        - Catchbook
      testTargets:
        - CatchbookTests
  CatchbookTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Catchbook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.aicompanyos.products.fishinglogbookTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Catchbook.app/Catchbook"
