[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-company-os"
version = "0.1.0"
description = "A local-first AI company operating system scaffold."
requires-python = ">=3.12"

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
]

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/python"]

[tool.coverage.run]
branch = true
source = ["apps", "packages"]
omit = [
    "*/__init__.py",
    "apps/api/main.py",
    "apps/worker-appstore/main.py",
    "apps/worker-engineering/main.py",
    "apps/worker-ios/main.py",
    "apps/worker-supervisor/main.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
