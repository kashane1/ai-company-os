[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-company-os"
version = "0.1.0"
description = "A local-first AI company operating system scaffold."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "Pillow>=12.3,<13",
    "psycopg[binary]>=3.2,<4",
    "python-multipart>=0.0.31,<1",
    "pyyaml>=6,<7",
    "redis>=5,<9",
    "stripe>=15.2.0",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=6,<7",
]
# Reply-sync poller (apps/worker-reply-sync). Kept optional so the core install
# stays lean — only the always-on Mac running the poller needs the Gmail client.
reply-sync = [
    "google-api-python-client>=2,<3",
    "google-auth-oauthlib>=1,<2",
]

[dependency-groups]
quality = [
    "ruff==0.14.11",
    "pip-audit==2.10.1",
]

[tool.setuptools]
# This repository is supported from a source checkout. The editable install
# resolves dependencies/metadata; it does not publish apps/packages as a wheel.
packages = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Enforce correctness and import hygiene. Paragraph length in comments/docs is
# an editorial concern, not a reason to reflow large source-history diffs.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Directly executable source-checkout entrypoints bootstrap sys.path before
# importing shared modules. Other import/correctness rules still apply.
"apps/*/main.py" = ["E402"]
"apps/api/platform.py" = ["E402"]
"apps/api/server.py" = ["E402"]
"apps/runtime-supervisor/cli.py" = ["E402"]
"apps/worker-ios/ios/runner.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/python"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
branch = true
source = ["apps", "packages"]
omit = [
    "*/__init__.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
