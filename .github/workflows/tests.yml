name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_COVERAGE_MIN: "85"
  # iOS coverage is reported per product without a percentage gate. UI suites
  # run where present; product READMEs record their remaining test boundaries.

jobs:
  tests-with-code:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PR_BODY: ${{ github.event.pull_request.body || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build changed-file manifest
        run: |
          mkdir -p build/ci
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            RANGE="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
            RANGE=""
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RANGE="HEAD^...HEAD"
          else
            RANGE="${{ github.event.before }}...${{ github.sha }}"
          fi
          if [[ -n "$RANGE" ]]; then
            git diff --name-status "$RANGE" > build/ci/changed-files.txt
          else
            git diff-tree --root --no-commit-id --name-status -r HEAD > build/ci/changed-files.txt
          fi
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            printf '%s' "$PR_BODY" > build/ci/testing-metadata.md
          else
            # Main's merge commit retains the reviewed PR body, including any
            # explicit no-test exception. Direct pushes still need matching tests.
            git log -1 --format=%B > build/ci/testing-metadata.md
          fi

      - name: Enforce tests-with-code policy
        run: |
          python3 ./scripts/ci/check_tests_with_code.py \
            --changed-files build/ci/changed-files.txt \
            --metadata-file build/ci/testing-metadata.md \
            --event-name "${{ github.event_name }}"

  python-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.22"
          python-version: ${{ matrix.python }}

      - name: Verify employer path without third-party packages
        run: ./scripts/evaluator_check.sh

      - name: Install Python test dependencies
        run: uv sync --frozen --extra test --group quality

      - name: Install isolated Redis test server
        run: sudo apt-get update && sudo apt-get install --yes redis-server

      - name: Run Python tests and coverage
        run: ./scripts/test_python.sh

      - name: Upload Python test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-${{ matrix.python }}-test-artifacts
          path: |
            build/test-results/python-latency-junit.xml
            build/test-results/python-junit.xml
            build/coverage/python-coverage.xml

  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: python-matrix
    if: always()
    steps:
      - name: Require every Python version
        env:
          MATRIX_RESULT: ${{ needs.python-matrix.result }}
        run: test "$MATRIX_RESULT" = success

  ios-matrix:
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        product: [catchbook, life-clock, after-plans]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version
          xcodebuild -version

      - name: Run iOS tests and coverage
        run: ./scripts/test_ios.sh --product "${{ matrix.product }}"

      - name: Upload iOS test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-${{ matrix.product }}-test-artifacts
          path: |
            build/ios/${{ matrix.product }}.xcresult

  ios-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: ios-matrix
    if: always()
    steps:
      - name: Require every iOS product
        env:
          MATRIX_RESULT: ${{ needs.ios-matrix.result }}
        run: test "$MATRIX_RESULT" = success

  python-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.22"
          python-version: "3.12"
      - run: uv sync --frozen --extra test --group quality
      - run: .venv/bin/ruff check apps packages scripts tests
      - name: Audit locked dependencies including optional adapters and tools
        run: |
          mkdir -p build
          uv export --frozen --all-extras --group quality --no-emit-project \
            --output-file build/audit-requirements.txt > /dev/null
          .venv/bin/pip-audit --requirement build/audit-requirements.txt --no-deps --disable-pip

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan reachable history with value-redacted diagnostics
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo:ro" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact=100 --log-opts=HEAD --gitleaks-ignore-path=/repo/.gitleaksignore /repo

  doc-path-check:
    # Required — a non-zero exit from check_doc_paths.sh fails the
    # workflow. Promoted from advisory after a sustained run of green
    # doc-path checks across PRs #51–#57.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run check_doc_paths.sh
        run: ./scripts/ci/check_doc_paths.sh

  token-efficiency:
    # Required — keeps the repo cheap for AI agents to operate in:
    #   * no finished plan left in the docs/plans/ working set
    #   * no heavy runtime files tracked under state/
    #   * new docs > 400 lines carry a TL;DR (existing offenders grandfathered
    #     in scripts/ci/token_efficiency_baseline.txt — a ratchet, not a wall)
    #   * generated docs INDEX.md files are up to date
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Token-efficiency gate
        run: python3 scripts/ci/token_efficiency_check.py

      - name: Doc indexes are fresh
        run: |
          python3 scripts/docs/gen_doc_index.py --check \
            docs/adr docs/decisions docs/founder docs/brainstorms \
            docs/failure-modes docs/security docs/runbooks docs/skills \
            docs/architecture docs/examples
          python3 scripts/docs/gen_doc_index.py --check --recursive \
            docs/solutions docs/agency docs/research

      - name: Plans index matches the live working set
        run: python3 scripts/docs/check_plans_index.py

      - name: Project-skill pointers match their adapters
        run: python3 scripts/skills/gen_project_skills.py --check
