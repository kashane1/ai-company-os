name: Tests

on:
  push:
    branches:
      - main
  pull_request:

env:
  PYTHON_COVERAGE_MIN: "55"
  # iOS coverage threshold intentionally not enforced: the iOS lane is
  # UI-heavy and snapshot/e2e coverage is deferred (see README "Testing").
  # check_ios_coverage.sh still reports the number; it just does not gate.

jobs:
  tests-with-code:
    runs-on: ubuntu-latest
    env:
      PR_BODY: ${{ github.event.pull_request.body || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build changed-file manifest
        run: |
          mkdir -p build/ci
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            RANGE="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
            RANGE="${{ github.sha }}"
          else
            RANGE="${{ github.event.before }}...${{ github.sha }}"
          fi
          git diff --name-status "$RANGE" > build/ci/changed-files.txt
          printf '%s' "$PR_BODY" > build/ci/testing-metadata.md

      - name: Enforce tests-with-code policy
        run: |
          python3 ./scripts/ci/check_tests_with_code.py \
            --changed-files build/ci/changed-files.txt \
            --metadata-file build/ci/testing-metadata.md \
            --event-name "${{ github.event_name }}"

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run Python tests and coverage
        run: ./scripts/test_python.sh

      - name: Upload Python test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-artifacts
          path: |
            build/test-results/python-junit.xml
            build/coverage/python-coverage.xml

  ios-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run iOS tests and coverage
        run: ./scripts/test_ios.sh

      - name: Upload iOS test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-artifacts
          path: |
            build/ios/Catchbook.xcresult

  doc-path-check:
    # Advisory only — fails are visible in logs but do not block the
    # workflow. Promote to required once the remaining findings are
    # addressed and we've decided on CI policy for doc-drift gating.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Run check_doc_paths.sh (advisory)
        run: |
          echo "Advisory check: scripts/ci/check_doc_paths.sh"
          echo "A non-zero exit will be visible in the logs but will not"
          echo "fail this workflow until the check is promoted to required."
          ./scripts/ci/check_doc_paths.sh
