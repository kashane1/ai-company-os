name: Tests

on:
  push:
    branches:
      - main
  pull_request:

env:
  PYTHON_COVERAGE_MIN: "55"
  IOS_COVERAGE_MIN: ""

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run Python tests and coverage
        run: ./scripts/test_python.sh

      - name: Upload Python test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-artifacts
          path: |
            build/test-results/python-junit.xml
            build/coverage/python-coverage.xml

  ios-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run iOS tests and coverage
        run: ./scripts/test_ios.sh

      - name: Upload iOS test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-artifacts
          path: |
            build/ios/FishingLogbook.xcresult
